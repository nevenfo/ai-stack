# Minimal Codex CLI coding profile. The base configuration remains unchanged
# for Codex Desktop and specialized sessions.

approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "disabled"
model = "gpt-6-astra"
model_reasoning_effort = "high"
model_verbosity = "low"
developer_instructions = """Réponds en français. Dans ce profil KiCad, Konnect est exposé au parent uniquement parce que Codex 0.159.x n'autorise pas un rôle à ajouter un MCP absent du parent. Le principal ne doit jamais appeler Konnect directement : toute inspection, opération ou diagnostic KiCad doit être délégué à kicad-control. Le sous-agent hérite alors du MCP et valide le résultat."""

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

[plugins."browser@openai-bundled"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = false

[plugins."sites@openai-bundled"]
enabled = false

[plugins."documents@openai-primary-runtime"]
enabled = false

[plugins."pdf@openai-primary-runtime"]
enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[mcp_servers.node_repl]
command = 'C:\Users\FlowUP\AppData\Local\OpenAI\Codex\runtimes\cua_node\<runtime-hash>\bin\node_repl.exe'
enabled = false

# Codex 0.159.x retire des rôles les MCP absents du parent : Konnect est donc
# exposé uniquement dans ce profil spécialisé pour que kicad-control l'hérite.
# Le principal a interdiction de l'appeler directement. Retirer ce contournement
# dès que Codex autorise un MCP privé de rôle sans exposition parent.
[mcp_servers.konnect]
command = "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
args = [
  "-NoProfile",
  "-NonInteractive",
  "-ExecutionPolicy",
  "Bypass",
  "-File",
  "C:\\Users\\FlowUP\\.agents\\konnect\\konnect-bootstrap.ps1"
]

[shell_environment_policy.set]
CLAUDE_CONFIG_DIR = 'C:\Users\FlowUP\.codex\rtk-cli'
