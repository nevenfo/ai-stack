# Pendant Codex de « Claude Opus 5 + effort high » : le modèle le plus capable du
# catalogue live du client (models_cache.json, priority 1), à un niveau de
# raisonnement élevé. Même intention opérationnelle, identifiants différents.
model = "gpt-6-astra"
model_reasoning_effort = "high"
model_verbosity = "low"
web_search = "disabled"
tool_output_token_limit = 4000
developer_instructions = "Réponds en français."
service_tier = "default"

notify = [ "C:\\Users\\FlowUP\\AppData\\Local\\OpenAI\\Codex\\runtimes\\cua_node\\<runtime-hash>\\bin\\node_modules\\@oai\\sky\\bin\\windows\\codex-computer-use.exe", "turn-ended" ]

# conv-exporter: native SessionEnd hook (added 2026-08-08). Fires once per
# session close, unlike `notify` (fires per turn) — see
# hooks/codex_session_end_hook.py for full rationale and backup path.
[[hooks.SessionEnd]]

[[hooks.SessionEnd.hooks]]
type = "command"
command = "python C:/Users/FlowUP/Documents/Etabli/Tools/conv-exporter/hooks/codex_session_end_hook.py"
command_windows = "python C:/Users/FlowUP/Documents/Etabli/Tools/conv-exporter/hooks/codex_session_end_hook.py"
timeout = 3

# NOA KPI: second SessionEnd hook, added 2026-09-04 ALONGSIDE conv-exporter,
# never in its place. It ingests this session's rollout (and those of its
# subagents) into noa/metrics/events.jsonl, then writes the session export.
# It always exits 0 and stays well inside the 3s budget: a KPI failure must
# never colour the end of a Codex session.
[[hooks.SessionEnd.hooks]]
type = "command"
command = "python C:/Users/FlowUP/noa/hooks/codex_session_end.py"
command_windows = "python C:/Users/FlowUP/noa/hooks/codex_session_end.py"
timeout = 3

